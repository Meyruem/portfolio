<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80" shape-rendering="crispEdges">
  <rect width="80" height="80" fill="none"/>
  <g fill="#c2a06a">
    <!-- central 8-point star / diamond motif -->
    <rect x="38" y="8" width="4" height="4"/>
    <rect x="34" y="12" width="4" height="4"/><rect x="42" y="12" width="4" height="4"/>
    <rect x="30" y="16" width="4" height="4"/><rect x="46" y="16" width="4" height="4"/>
    <rect x="26" y="20" width="4" height="4"/><rect x="50" y="20" width="4" height="4"/>
    <rect x="22" y="24" width="4" height="4"/><rect x="54" y="24" width="4" height="4"/>
    <!-- inner cross -->
    <rect x="38" y="24" width="4" height="4"/>
    <rect x="34" y="28" width="4" height="4"/><rect x="42" y="28" width="4" height="4"/>
    <rect x="30" y="32" width="4" height="4"/><rect x="46" y="32" width="4" height="4"/>
    <rect x="38" y="32" width="4" height="4"/>
    <rect x="22" y="36" width="4" height="4"/><rect x="54" y="36" width="4" height="4"/>
    <rect x="18" y="36" width="4" height="4"/><rect x="58" y="36" width="4" height="4"/>
    <rect x="34" y="36" width="4" height="4"/><rect x="42" y="36" width="4" height="4"/>
    <!-- mirror lower half -->
    <rect x="30" y="40" width="4" height="4"/><rect x="46" y="40" width="4" height="4"/>
    <rect x="38" y="40" width="4" height="4"/>
    <rect x="34" y="44" width="4" height="4"/><rect x="42" y="44" width="4" height="4"/>
    <rect x="38" y="48" width="4" height="4"/>
    <rect x="22" y="48" width="4" height="4"/><rect x="54" y="48" width="4" height="4"/>
    <rect x="26" y="52" width="4" height="4"/><rect x="50" y="52" width="4" height="4"/>
    <rect x="30" y="56" width="4" height="4"/><rect x="46" y="56" width="4" height="4"/>
    <rect x="34" y="60" width="4" height="4"/><rect x="42" y="60" width="4" height="4"/>
    <rect x="38" y="64" width="4" height="4"/>
    <!-- corner accents to tile seamlessly -->
    <rect x="6" y="6" width="4" height="4"/><rect x="70" y="6" width="4" height="4"/>
    <rect x="6" y="70" width="4" height="4"/><rect x="70" y="70" width="4" height="4"/>
    <rect x="2" y="38" width="4" height="4"/><rect x="74" y="38" width="4" height="4"/>
    <rect x="38" y="74" width="4" height="4"/>
  </g>
</svg>
