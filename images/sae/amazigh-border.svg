<svg xmlns="http://www.w3.org/2000/svg" width="48" height="96" viewBox="0 0 48 96" shape-rendering="crispEdges">
  <!-- Amazigh / Moroccan jersey motif — vertical tile (repeats on Y) -->
  <!-- teal background -->
  <rect width="48" height="96" fill="#1e5957"/>
  <!-- cream side rails -->
  <rect x="2" y="0" width="3" height="96" fill="#e8e0c4"/>
  <rect x="43" y="0" width="3" height="96" fill="#e8e0c4"/>
  <!-- diamond unit 1 (centered y=24) -->
  <g fill="#c8485a">
    <rect x="22" y="6" width="4" height="4"/>
    <rect x="18" y="10" width="4" height="4"/><rect x="26" y="10" width="4" height="4"/>
    <rect x="14" y="14" width="4" height="4"/><rect x="30" y="14" width="4" height="4"/>
    <rect x="10" y="18" width="4" height="4"/><rect x="34" y="18" width="4" height="4"/>
    <rect x="14" y="22" width="4" height="4"/><rect x="30" y="22" width="4" height="4"/>
    <rect x="18" y="26" width="4" height="4"/><rect x="26" y="26" width="4" height="4"/>
    <rect x="22" y="30" width="4" height="4"/>
    <!-- inner center cross -->
    <rect x="22" y="18" width="4" height="4"/>
  </g>
  <g fill="#e8e0c4">
    <rect x="22" y="14" width="4" height="4"/>
    <rect x="18" y="18" width="4" height="4"/><rect x="26" y="18" width="4" height="4"/>
    <rect x="22" y="22" width="4" height="4"/>
  </g>
  <!-- connecting cream zig between diamonds -->
  <g fill="#e8e0c4">
    <rect x="22" y="34" width="4" height="4"/>
    <rect x="22" y="38" width="4" height="4"/>
  </g>
  <!-- diamond unit 2 (centered y=66) mirrors unit 1 -->
  <g fill="#c8485a">
    <rect x="22" y="42" width="4" height="4"/>
    <rect x="18" y="46" width="4" height="4"/><rect x="26" y="46" width="4" height="4"/>
    <rect x="14" y="50" width="4" height="4"/><rect x="30" y="50" width="4" height="4"/>
    <rect x="10" y="54" width="4" height="4"/><rect x="34" y="54" width="4" height="4"/>
    <rect x="14" y="58" width="4" height="4"/><rect x="30" y="58" width="4" height="4"/>
    <rect x="18" y="62" width="4" height="4"/><rect x="26" y="62" width="4" height="4"/>
    <rect x="22" y="66" width="4" height="4"/>
    <rect x="22" y="54" width="4" height="4"/>
  </g>
  <g fill="#e8e0c4">
    <rect x="22" y="50" width="4" height="4"/>
    <rect x="18" y="54" width="4" height="4"/><rect x="26" y="54" width="4" height="4"/>
    <rect x="22" y="58" width="4" height="4"/>
  </g>
  <g fill="#e8e0c4">
    <rect x="22" y="70" width="4" height="4"/>
    <rect x="22" y="74" width="4" height="4"/>
  </g>
  <!-- small red corner accents to fill teal -->
  <g fill="#c8485a">
    <rect x="6" y="40" width="4" height="4"/><rect x="38" y="40" width="4" height="4"/>
    <rect x="6" y="78" width="4" height="4"/><rect x="38" y="78" width="4" height="4"/>
    <rect x="22" y="86" width="4" height="4"/>
    <rect x="18" y="90" width="4" height="4"/><rect x="26" y="90" width="4" height="4"/>
  </g>
</svg>
