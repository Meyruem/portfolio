<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Broderie amazighe or sur blanc · tuile sans couture (réseau de losanges + croix) -->
  <g fill="none" stroke="#b6862c" stroke-linejoin="miter">
    <!-- losange-cellule principal -->
    <path d="M45 0 L90 45 L45 90 L0 45 Z" stroke-width="2.4"/>
    <path d="M45 10 L80 45 L45 80 L10 45 Z" stroke-width="1.6" stroke="#caa24e"/>
    <path d="M45 22 L68 45 L45 68 L22 45 Z" stroke-width="1.8"/>
    <!-- coeur : petite croix amazighe -->
    <path d="M45 36 L45 54 M36 45 L54 45" stroke-width="2" stroke="#a8771f"/>
    <path d="M45 33 L51 39 M45 33 L39 39 M45 57 L51 51 M45 57 L39 51" stroke-width="1.4" stroke="#caa24e"/>
    <!-- crochets aux pointes -->
    <path d="M45 0 l4 4 M45 0 l-4 4 M90 45 l-4 4 M90 45 l-4 -4 M45 90 l4 -4 M45 90 l-4 -4 M0 45 l4 4 M0 45 l4 -4" stroke-width="1.6" stroke="#caa24e"/>
    <!-- petits points de broderie le long du grand losange -->
    <g fill="#b6862c" stroke="none">
      <circle cx="22.5" cy="22.5" r="1.5"/><circle cx="67.5" cy="22.5" r="1.5"/>
      <circle cx="67.5" cy="67.5" r="1.5"/><circle cx="22.5" cy="67.5" r="1.5"/>
    </g>
  </g>
  <!-- noeuds-croix aux coins (1/4 par coin) -->
  <g stroke="#b6862c" stroke-width="2" fill="none">
    <path d="M0 -6 L0 6 M-6 0 L6 0"/>
    <path d="M90 -6 L90 6 M84 0 L96 0"/>
    <path d="M0 84 L0 96 M-6 90 L6 90"/>
    <path d="M90 84 L90 96 M84 90 L96 90"/>
  </g>
</svg>
